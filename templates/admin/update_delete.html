{% extends "admin/base.html" %}
{% block content %}
  <h1>Delete “{{ update.title }}”?</h1>
  {% if update.status == "published" %}
  <p class="error" role="alert">This update is published. Deleting it removes it from the
     public site at the next <code>cms publish</code> and <code>cms deploy</code>.</p>
  {% endif %}
  <p>This cannot be undone.</p>
  <form method="post" action="{{ url_for('delete_update', update_id=update.id).path }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button type="submit">Yes, delete it</button>
  </form>
  <p><a href="{{ url_for('show_update', update_id=update.id).path }}">No, keep it</a></p>
{% endblock %}
