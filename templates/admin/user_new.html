{% extends "admin/base.html" %}
{% block content %}
  <h1>New user</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('create_user').path }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="email">Email
      <input id="email" name="email" type="email" value="{{ email }}" required autocomplete="off">
    </label>
    <label for="name">Name
      <input id="name" name="name" value="{{ name }}" required>
    </label>
    <label for="role">Role
      <select id="role" name="role">
        <option value="editor"{% if role == "editor" %} selected{% endif %}>Editor</option>
      </select>
    </label>
    <label for="password">Starting password (at least {{ min_password_length }} characters)
      <input id="password" name="password" type="password" minlength="{{ min_password_length }}" required autocomplete="new-password">
    </label>
    <button type="submit">Add user</button>
  </form>
  <p>New users are editors. To make someone the admin, use hand-over on the
     <a href="{{ url_for('list_users').path }}">users list</a>.</p>
{% endblock %}
