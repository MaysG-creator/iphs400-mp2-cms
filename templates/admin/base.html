<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · CMS admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font: 16px/1.5 system-ui, sans-serif; margin: 0 auto; max-width: 48rem; padding: 1rem; }
    nav { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center;
          border-bottom: 1px solid #ccc; padding-bottom: .5rem; }
    nav form { margin-left: auto; }
    label { display: block; margin-top: 1rem; }
    input, textarea { width: 100%; max-width: 24rem; padding: .5rem; font: inherit; }
    textarea { max-width: none; min-height: 12rem; }
    button { margin-top: 1rem; padding: .5rem 1rem; font: inherit; }
    nav button { margin-top: 0; }
    .error { border: 1px solid #b00020; color: #b00020; padding: .5rem; }
    .success { border: 1px solid #1b5e20; color: #1b5e20; padding: .5rem; }
    .preview { border: 1px dashed #999; padding: 0 1rem; }
    .preview img { max-width: 100%; }
    .preview pre { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: .25rem .5rem .25rem 0; vertical-align: top; }
    main { overflow-wrap: anywhere; }
    .counts { display: flex; flex-wrap: wrap; gap: 1rem; padding: 0; }
    .counts div { border: 1px solid #ccc; padding: .5rem 1rem; min-width: 9rem; }
    .counts dd { margin: 0; font-size: 2rem; }
    .filters { display: flex; flex-wrap: wrap; gap: 0 1rem; align-items: end; margin-bottom: 1rem; }
    .filters label { margin-top: .5rem; }
    select { display: block; padding: .5rem; font: inherit; }
    /* Under 30rem a content row becomes a small card, so nothing scrolls sideways. */
    @media (max-width: 30rem) {
      table.stack thead { display: none; }
      table.stack tr { display: block; border-top: 1px solid #ccc; padding: .5rem 0; }
      table.stack td { display: block; padding: 0; }
      table.stack td[data-label]::before { content: attr(data-label) ": "; color: #555; }
    }
  </style>
</head>
<body>
  {% if user %}
  <nav>
    <strong>CMS admin</strong>
    <a href="{{ url_for('admin_home').path }}">Home</a>
    <a href="{{ url_for('content_list').path }}">Content</a>
    <a href="{{ url_for('list_updates').path }}">Updates</a>
    <a href="{{ url_for('new_update').path }}">New update</a>
    <a href="{{ url_for('list_pages').path }}">Pages</a>
    <a href="{{ url_for('new_page').path }}">New page</a>
    <span>{{ user.name }} ({{ user.email }}, {{ user.role }})</span>
    <form method="post" action="/logout">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit">Log out</button>
    </form>
  </nav>
  {% endif %}
  <main>
    {% if flash %}<p class="{{ flash.kind }}" role="status">{{ flash.text }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
