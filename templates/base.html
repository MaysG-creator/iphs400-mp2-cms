<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ title }}{% endblock %}</title>
  {#- `root` is the relative path back to the site root: "" or "../". -#}
  {% set root = root | default("") %}
  <link rel="stylesheet" href="{{ root }}style.css">
</head>
<body>
  <header class="banner">
    <a href="{{ root }}index.html">{{ site_title | default(title) }}</a>
  </header>
  {% if nav %}
  <nav class="site-nav" aria-label="Pages">
    <a href="{{ root }}index.html">Home</a>
    {% for link in nav %}<a href="{{ root }}{{ link.href }}">{{ link.title }}</a>
    {% endfor %}
  </nav>
  {% endif %}
  <main>{% block content %}{% endblock %}</main>
  <footer><small>IPHS 400 Mini-Project #2</small></footer>
</body>
</html>
