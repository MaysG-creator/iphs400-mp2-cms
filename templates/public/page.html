{% extends "base.html" %}
{% block title %}{{ title }} · {{ site_title }}{% endblock %}
{% block content %}
  <article>
    <h1>{{ title }}</h1>
    <p class="meta">Last updated <time datetime="{{ page.updated_at }}">{{ page.updated_at | local_date }}</time></p>
    {{ body | safe }}
  </article>
{% endblock %}
